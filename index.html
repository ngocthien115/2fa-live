<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1014" />
    <title>TOTP Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="2fa_live.css" />
    <script src="2fa_live.js" defer></script>
  </head>
  <body>
    <div class="app" id="app">
      <!-- SIDEBAR (desktop / tablet) -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">TOTP Vault</span>
            <span class="brand-sub">Local authenticator</span>
          </div>
        </div>

        <nav class="groups" aria-label="Danh sách group">
          <div class="groups-head">
            <span class="section-label">Groups</span>
            <button type="button" class="icon-btn outline sm" data-action="toggle-new-group" aria-label="Tạo group mới" aria-expanded="false">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
          <div data-slot="new-group"></div>
          <div class="group-list" id="group-list"></div>
        </nav>

        <div class="backup-card">
          <div class="backup-note">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"></path><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg>
            <span>Dữ liệu chỉ nằm trong localStorage của trình duyệt này. Hãy backup định kỳ.</span>
          </div>
          <div class="backup-actions">
            <button type="button" class="btn outline sm" data-action="export">Xuất backup</button>
            <button type="button" class="btn outline sm" data-action="import">Nhập backup</button>
          </div>
        </div>
      </aside>

      <!-- CONTENT -->
      <main class="workspace">
        <!-- Mobile app bar + group chips -->
        <div class="mobile-bar mobile-only">
          <div class="mobile-bar-top">
            <div class="brand">
              <div class="brand-logo" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
              </div>
              <span class="brand-name lg">TOTP Vault</span>
            </div>
            <div class="timer-pill compact" aria-hidden="true">
              <svg class="ring" width="22" height="22" viewBox="0 0 44 44"><circle class="ring-track" cx="22" cy="22" r="18"></circle><circle class="ring-fill" cx="22" cy="22" r="18"></circle></svg>
              <b class="timer-value">30s</b>
            </div>
          </div>
          <nav class="chip-scroll" id="group-chips" aria-label="Danh sách group"></nav>
          <div data-slot="new-group"></div>
        </div>

        <header class="ws-head" id="ws-head"></header>
        <div id="group-delete-banner"></div>

        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="search" type="search" aria-label="Tìm tài khoản" placeholder="Tìm tài khoản trong mọi group…" autocomplete="off" spellcheck="false" />
        </div>

        <div class="grid" id="grid"></div>
        <div id="empty"></div>

        <div class="backup-card mobile-only">
          <span class="backup-note-text">Dữ liệu chỉ nằm trong localStorage của trình duyệt này. Hãy backup định kỳ.</span>
          <div class="backup-actions">
            <button type="button" class="btn outline" data-action="export">Xuất backup</button>
            <button type="button" class="btn outline" data-action="import">Nhập backup</button>
          </div>
        </div>
      </main>

      <!-- ADD / EDIT PANEL -->
      <button type="button" class="backdrop" id="backdrop" data-action="close-panel" aria-label="Đóng panel" tabindex="-1" hidden></button>
      <aside class="panel" id="panel" aria-label="Thêm tài khoản" hidden></aside>

      <button type="button" class="fab mobile-only" id="fab" data-action="open-add" aria-label="Thêm tài khoản">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <input type="file" id="import-file" accept="application/json,.json" hidden />
  </body>
</html>
